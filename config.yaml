embedding:
  model_name: BAAI/bge-m3

llm:
  base_url: https://router.bynara.id/v1
  model: mistral-medium-3-5
  temperature: 0.5
  # temperature: 0.2
  request_timeout: 60
  max_retries: 2

chunking:
  chunk_size: 800
  chunk_overlap: 150

retrieval:
  score_threshold: 0.3343
  # score_threshold: 0.2741   # bisa dioverride lewat .env -> SCORE_THRESHOLD
  fetch_k_baseline: 20
  fetch_k_scg: 22
  target_k: 10

reranker:
  model_name: BAAI/bge-reranker-base

paths:
  data_pdf: ./data/pdf
  chroma_baseline: ./vectorstore/chroma_db
  chroma_scg: ./vectorstore/chroma_db_scg
  scg_checkpoint: ./vectorstore/scg_checkpoint.jsonl
  eval_checkpoint: ./vectorstore/eval_checkpoint.jsonl
  ground_truth: ground_truth_chatbot.xlsx

conversation:
  max_history_turns: 10
