embedding:
  model_name: BAAI/bge-m3

llm:
  base_url: https://api.cosmoshub.tech/v1
  # base_url: https://9router-o5jfqowcef5e.jkt6.sumopod.my.id/v1
  # base_url: https://router.bynara.id/v1
  model: claude-sonnet-4.5
  # model: deepseek-v4-pro
  # temperature: 0.5
  temperature: 0.2
  request_timeout: 90
  max_retries: 2

chunking:
  chunk_size: 800
  chunk_overlap: 150

retrieval:
  # Placeholder sampai scripts/test_threshold.py dijalankan setelah
  # Baseline dan SCG dibangun ulang dengan metric cosine.
  # score_threshold: 0.0
  # score_threshold_baseline: 0.0
  # score_threshold_scg: 0.0
  # SCORE_THRESHOLD tetap dapat dioverride lewat .env untuk eksperimen.
  fetch_k_baseline: 10
  fetch_k_scg: 10
  target_k: 5

reranker:
  model_name: BAAI/bge-reranker-v2-m3

paths:
  data_pdf: ./data/pdf
  chroma_baseline: ./vectorstore/chroma_db
  chroma_scg: ./vectorstore/chroma_db_scg
  scg_checkpoint: ./vectorstore/scg_checkpoint.jsonl
  eval_checkpoint: ./vectorstore/eval_checkpoint_scg.jsonl
  ground_truth: ground_truth_chatbot - Copy - Copy.xlsx

conversation:
  max_history_turns: 10
