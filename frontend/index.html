<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MimoMou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ======================================================= -->
    <!-- SCREEN 1: LANDING — tampil pertama kali dibuka           -->
    <!-- ======================================================= -->
    <section id="landing-screen" class="landing">
      <div class="landing-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="34" height="34" fill="none">
          <rect x="14" y="22" width="36" height="28" rx="10" stroke="currentColor" stroke-width="3.5"/>
          <circle cx="25" cy="36" r="3.5" fill="currentColor"/>
          <circle cx="39" cy="36" r="3.5" fill="currentColor"/>
          <path d="M32 22V13" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="32" cy="9" r="3.5" fill="currentColor"/>
          <path d="M8 32h6M50 32h6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 class="landing-title">Halo, aku MimoMou</h2>
      <p class="landing-sub">
        Tanya-tanya soal blu, Jago, SeaBank, atau literasi keuangan digital lainnya.
      </p>
      <button id="start-chat-btn" class="landing-cta" type="button">Mulai Chat Baru</button>
    </section>

    <!-- ======================================================= -->
    <!-- SCREEN 2: CHAT — tampil setelah "Mulai Chat Baru"        -->
    <!-- ======================================================= -->
    <section id="chat-screen" class="chat-screen hidden">
      <header class="app-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <h1>MimoMou</h1>
        </div>

        <div class="controls">
          <!-- Segmented toggle: dua metode retrieval yang dibandingkan di skripsi -->
          <div class="mode-toggle" id="mode-toggle" role="tablist" aria-label="Mode retrieval">
            <button type="button" class="mode-btn" data-mode="Baseline" role="tab" aria-selected="false">
              Baseline
            </button>
            <button type="button" class="mode-btn active" data-mode="SCG" role="tab" aria-selected="true">
              SCG
            </button>
          </div>
          <button id="new-chat-btn" title="Mulai percakapan baru">Chat Baru</button>
        </div>
      </header>

      <main id="chat-window" class="chat-window">
        <!-- pesan akan di-render di sini oleh script.js -->
      </main>

      <form id="chat-form" class="chat-form">
        <textarea
          id="chat-input"
          placeholder="Tanya soal blu, Jago, atau SeaBank..."
          rows="1"
          required
        ></textarea>
        <button id="send-btn" type="submit">Kirim</button>
      </form>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
